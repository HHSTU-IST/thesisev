[project]
name = "thesisev"
version = "0.1.0"
description = "A thesis evaluation assistant for structure analysis, issue detection, and comment generation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.136.3",
  "jinja2>=3.1.6",
  "langchain>=1.3.2",
  "langchain-openai>=1.2.2",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.20",
  "tiktoken>=0.13.0",
  "uvicorn>=0.48.0",
]

[project.scripts]
thesisev = "thesisev.cli:main"
thesisev-api = "thesisev.api:run_api"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thesisev"]
include = [
  "config/*.json",
  "config/*.toml",
  "templates/*.html",
  "static/*.css",
  "static/*.js",
]

[tool.ruff]
fix = true
fix-only = true
target-version = "py313"
line-length = 88

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings
docstring-code-format = true
# Format all docstring code snippets with a line length of 60
docstring-code-line-length = 60
# Use `\n` line endings for all files
line-ending = "lf"

[tool.ruff.lint]
extend-select = [
  "DTZ",
  "E",
  "F",
  "I",
  "ISC",
  "NPY",
  "PERF",
  "RUF",
  "S",
  "SIM",
  "TID",
  "UP",
  "W",
]
fixable = ["ALL"]
ignore = [
  "E501",
  "ISC001",
  "RUF001",
  "RUF002",
  "RUF003",
  "S101",
  "S603",
]

unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = true
order-by-type = true
