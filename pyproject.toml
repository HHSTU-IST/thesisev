[project]
name = "thesisev"
version = "0.1.0"
description = "A thesis evaluation assistant for structure analysis, issue detection, and comment generation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.136.3",
    "jinja2>=3.1.6",
    "langchain>=1.3.2",
    "langchain-openai>=1.2.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "tiktoken>=0.13.0",
    "uvicorn>=0.48.0",
]

[project.scripts]
thesisev = "thesisev.cli:main"
thesisev-api = "thesisev.api:run_api"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thesisev"]
include = [
    "config/*.json",
    "config/*.toml",
    "templates/*.html",
    "static/*.css",
    "static/*.js",
]

[tool.ruff]
fix = true
fix-only = true
target-version = "py313"
line-length = 88

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings
docstring-code-format = true
# Format all docstring code snippets with a line length of 60
docstring-code-line-length = 60
# Use `\n` line endings for all files
line-ending = "lf"

[tool.ruff.lint]
extend-select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "EM",  # flake8-errmsg
  "FA",  # flake8-future-annotations
  "G",  # flake8-logging-format
  "INT",  # flake8-gettext
  "PIE",  # flake8-pie
  "PT",  # flake8-pytest-style
  "PYI",  # flake8-pyi
  "Q",  # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "SLOT",  # flake8-slots
  "T10",  # flake8-debugger
  "YTT",  # flake8-2020
  "DTZ",  # naive datetime
  "I",  # import sorting
  "ISC",  # string concatenation
  "NPY",  # numpy specific rules
  "PERF",  # perflint
  "RUF",  # ruff
  "S",  # security
  "SIM",  # simplify
  "T10",  # debugger
  "TID",  # tidy imports
  "UP",  # upgrade
]
fixable = ["ALL"]
ignore = [
  "EM101",  # exception must not use a string literal
  "EM102",  # exception must not use an f-string literal
  "ISC001",  # conflicts with formatter
  "E501",  # line too long
  "RUF001",  # string contains ambiguous character (such as greek letters)
  "RUF002",  # docstring contains ambiguous character (such as greek letters)
  "RUF003",  # string contains non-ASCII character
]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = true
order-by-type = true
