[project]
name = "thesisev"
version = "0.1.0"
description = "A thesis evaluation assistant for structure analysis, issue detection, and comment generation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.141.1",
  "jinja2>=3.1.6",
  "langchain>=1.4.2",
  "langchain-openai>=1.6.6",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.32",
  "tiktoken>=0.14.0",
  "uvicorn>=0.54.0",
]

[project.scripts]
thesisev = "thesisev.cli:main"
thesisev-api = "thesisev.api:run_api"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.9",
  "ty>=0.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thesisev"]
include = [
  "config/*.json",
  "config/*.toml",
  "templates/*.html",
  "static/*.css",
  "static/*.js",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings
docstring-code-format = true
# Format all docstring code snippets with a line length of 60
docstring-code-line-length = 60
# Use `\n` line endings for all files
line-ending = "lf"

[tool.ruff.lint]
extend-select = [
  "DTZ",
  "E",
  "F",
  "I",
  "ISC",
  "NPY",
  "PERF",
  "RUF",
  "S",
  "SIM",
  "TID",
  "UP",
  "W",
]
fixable = ["ALL"]
ignore = [
  "RUF001",
  "RUF002",
  "RUF003",
  "S101",
  "S310",
  "S603",
]

unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = true
order-by-type = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
# ty has no preset switch; enable every stable rule at error to match the
# strictest level (previously pyrefly strict preset) and fail loudly on
# implicit-any/unsound patterns.
all = "error"

[tool.ty.src]
include = [
  "thesisev",
  "tests",
]
exclude = [
  ".venv",
  ".workbuddy",
  "data",
  "build",
  "dist",
]
# `tests/` is in .gitignore, and ty honours ignore files by default — which
# would silently drop it from the `include` above. Opt out so the declared
# source set is what actually gets checked.
respect-ignore-files = false

[tool.ty.terminal]
output-format = "full"
